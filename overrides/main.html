{% extends "base.html" %}

{% block content %}
  {{ super() | replace('href="https://forum.feiyang.ac.cn"', 'href="' ~ (config.extra.bbs_url | e) ~ '"') }}
  {% if config.extra.discourse_url and page and not page.is_homepage and page.file.src_uri != 'index.md' %}
    <div id="discourse-comments"></div>
    <script>
      (() => {
        window.DiscourseEmbed = {
          discourseUrl: {{ (config.extra.discourse_url.rstrip('/') ~ '/') | tojson }},
          discourseEmbedUrl: {{ page.canonical_url | tojson }}
        };
        const script = document.createElement("script");
        script.async = true;
        script.src = window.DiscourseEmbed.discourseUrl + "javascripts/embed.js";
        document.getElementById("discourse-comments").after(script);
      })();
    </script>
  {% endif %}
{% endblock %}
