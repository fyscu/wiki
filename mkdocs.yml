site_name: 飞扬 Wiki
site_url: !ENV [WIKI_SITE_URL, "https://wiki.feiyang.ac.cn/"]
site_description: 四川大学飞扬俱乐部的维修、网络与技术知识库
copyright: Copyright &copy; 四川大学飞扬俱乐部 · Feiyang Wiki
repo_url: !ENV [GITHUB_REPO_URL, "https://github.com/fyscu/wiki"]
edit_uri: edit/main/docs/
site_dir: .site

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: images/manual/club-mark.webp
  favicon: favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: [zh, en]
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

nav:
  - 硬件与维修:
      - 故障速查: handbook/index.md
      - 维修手册导览: handbook/manual-guide.md
      - 日常保养与故障处理:
          - 电脑使用与日常保养: handbook/daily-care.md
          - 笔记本进水急救: handbook/liquid-spill.md
          - Windows 蓝屏排查: handbook/windows-stop-errors.md
      - 硬件与存储:
          - 计算机工作方式与设备形态: handbook/computing-basics.md
          - 核心硬件与接口识别: handbook/hardware-components.md
          - 显示器、键盘、鼠标与机身材料: handbook/peripherals-and-display.md
          - 磁盘物理结构与分区表: handbook/disk-structure.md
          - 文件系统、分区与 SSD 使用: handbook/file-systems-partitions.md
          - GB、GiB 与 USB 接口: handbook/storage-formats-and-usb.md
      - 启动与引导:
          - 计算机启动与排障: handbook/startup.md
          - 启动链、BIOS 与固件设置: handbook/firmware-and-boot.md
          - 电源状态、UEFI 与 MBR/GPT 引导: handbook/power-states-uefi.md
      - 拆装与检测:
          - 笔记本拆机准备与连接器识别: handbook/laptop-disassembly.md
          - 笔记本拆机清灰与复装检查: handbook/laptop-cleaning-reassembly.md
          - 启动介质、分区与数据恢复工具: handbook/repair-media-and-storage-tools.md
          - 硬件检测、健康检查与压力测试: handbook/diagnostics-and-stress-tools.md
  - 网络与连接:
      - 四川大学校园网接入与排障: network/campus-network-history.md
      - "网络基础：IP、DNS 与 DHCP": network/network-basics.md
      - 家庭网络与路由器排障: network/network-repair-router.md
      - 连接故障与 ping 诊断: network/ping-browser.md
  - 数字生活与效率:
      - 认识 Windows、macOS 和 Linux: software/operating-systems.md
      - 安装与迁移系统:
          - Windows 重装前的准备: software/windows-installation-basics.md
          - 安装 Windows 与迁移系统: software/windows-installation-and-migration.md
          - 双系统安装与启动: software/dual-boot-virtualization.md
          - macOS 恢复与 Boot Camp: software/mac-recovery-bootcamp.md
      - 软件与效率:
          - Windows 日常维护与快捷键: software/maintenance-and-shortcuts.md
          - 文件压缩与归档: software/file-compression.md
          - 安装 Adobe 与 AutoCAD: software/software-installation-history.md
          - 软件卸载与 DLL 缺失: software/repairing-apps.md
  - 开发与折腾:
      - 创建和使用虚拟机: development/virtual-machines.md
      - .NET 与 Visual Studio: development/dotnet-and-visual-studio.md
      - Windows 注册表与 .reg 文件: development/windows-registry.md
  - 共建与论坛:
      - 关于飞扬 Wiki 与论坛: intro/about.md
      - 开始阅读: index.md
      - 参与贡献: contribute.md
      - 文档内容约定: intro/content.md
      - 进入论坛: &bbs_url !ENV [BBS_URL, "https://forum.feiyang.ac.cn"]

extra:
  generator: false
  bbs_url: *bbs_url
  discourse_url: !ENV [DISCOURSE_URL, ""]
