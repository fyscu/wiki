limit_req_zone $binary_remote_addr zone=wiki_accounts:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=wiki_email:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=wiki_editor:1m rate=180r/m;
log_format wiki_privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name wiki.feiyang.ac.cn;
    return 301 https://wiki.feiyang.ac.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wiki.feiyang.ac.cn;
    ssl_certificate /www/sites/wiki.feiyang.ac.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/wiki.feiyang.ac.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WikiSSL:1m;
    ssl_session_timeout 1d;
    root /www/sites/wiki.feiyang.ac.cn/content/index;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/feiyang-wiki.access.log wiki_privacy;
    error_log /var/log/nginx/feiyang-wiki.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=86400" always;
    include /www/sites/wiki.feiyang.ac.cn/community-api.conf;

    location ^~ /_editor/ {
        client_max_body_size 9m;
        limit_req zone=wiki_editor burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }

    location = /account-status.json {
        alias /www/sites/wiki.feiyang.ac.cn/account-status.json;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /assets/community/ { expires 1y; }
    location /assets/ { expires 1d; }
    location = /_qa/questions {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($arg_tag !~ "^doc-[0-7][0-9a-hjkmnp-tv-z]{25}$") { return 400; }
        proxy_pass http://127.0.0.1:9080/answer/api/v1/question/page?tag=$arg_tag&page=1&page_size=5&order=active;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
    location /_qa/ { return 404; }
    location /answer/ { return 404; }
    location /admin/ { return 404; }
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~ /\. { deny all; }
}
