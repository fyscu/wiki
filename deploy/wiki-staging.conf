server {
    listen 127.0.0.1:9081;
    server_name localhost;
    root /www/sites/feiyang-wiki-staging/index;
    index index.html;
    access_log /var/log/nginx/feiyang-wiki-staging.access.log;
    error_log /var/log/nginx/feiyang-wiki-staging.error.log;
    include /www/sites/feiyang-wiki-staging/community-api.conf;

    location = /_qa/questions {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($arg_tag !~ "^doc-[0-7][0-9a-hjkmnp-tv-z]{25}$") { return 400; }
        proxy_pass http://127.0.0.1:9080/answer/api/v1/question/page?tag=$arg_tag&page=1&page_size=5&order=active;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Host 127.0.0.1:9080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location /_qa/ { return 404; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~ /\. { deny all; }
}
