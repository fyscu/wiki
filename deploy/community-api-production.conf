# Generated from lib/api-routes.mjs.
set $wiki_comment_arg "";
if ($arg_commentId ~ "^[0-9]{1,20}$") { set $wiki_comment_arg "&commentId=$arg_commentId"; }
location ~ "^/questions/(?<wiki_question_id>[0-9]{1,20})/(?:[^/]+/)?(?<wiki_answer_id>[0-9]{1,20})/?$" {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Cache-Control "no-store" always;
    return 302 "/question/?id=$wiki_question_id&answer=$wiki_answer_id$wiki_comment_arg";
}

location ~ "^/questions/(?<wiki_question_id>[0-9]{1,20})(?:/[^/]+)?/?$" {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Cache-Control "no-store" always;
    return 302 "/question/?id=$wiki_question_id$wiki_comment_arg";
}

