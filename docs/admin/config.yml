# yaml-language-server: $schema=https://cdn.jsdelivr.net/npm/@sveltia/cms@0.271.3/schema/sveltia-cms.json
backend:
  name: github
  repo: fyscu/wiki
  branch: main
  auth_methods: [token]

media_folder: docs/images/manual
public_folder: /images/manual
omit_empty_optional_fields: true

collections:
  - name: handbook
    label: 硬件与维修
    folder: docs/handbook
    delete: false
    nested: &article_tree { subfolders: false }
    meta: &article_path { path: {} }
    fields: &article
      - { name: title, label: 标题, widget: string, required: false }
      - { name: description, label: 简介, widget: text, required: false }
      - { name: doc_id, widget: hidden, required: false }
      - { name: manual_pages, label: 手册页码, widget: list, field: { name: page, widget: number }, required: false }
      - { name: owners, label: 维护者, widget: list, required: false }
      - { name: tags, label: 标签, widget: list, required: false }
      - { name: updated, label: 更新时间, widget: string, required: false }
      - { name: body, label: 正文, widget: markdown, modes: [raw, rich_text] }
  - name: network
    label: 网络与连接
    folder: docs/network
    delete: false
    nested: *article_tree
    meta: *article_path
    fields: *article
  - name: software
    label: 数字生活与效率
    folder: docs/software
    delete: false
    nested: *article_tree
    meta: *article_path
    fields: *article
  - name: development
    label: 开发与折腾
    folder: docs/development
    delete: false
    nested: *article_tree
    meta: *article_path
    fields: *article
  - name: intro
    label: 共建与论坛
    folder: docs/intro
    delete: false
    nested: *article_tree
    meta: *article_path
    fields: *article
